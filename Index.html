<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#FFF8E7">
  <title>SoulBeads 🪷</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Georgia, "Times New Roman", serif;
      min-height: 100vh;
      background:
        radial-gradient(circle at top, rgba(255,255,255,.8), transparent 40%),
        linear-gradient(135deg, #FFF8E7, #F7E7CE);
      color: #4b3525;
      padding: 20px;
    }

    .app {
      max-width: 700px;
      margin: auto;
    }

    .header {
      text-align: center;
      padding: 25px 10px 30px;
    }

    .header .symbol {
      font-size: 34px;
      margin-bottom: 8px;
    }

    .header h1 {
      font-size: 38px;
      letter-spacing: 1px;
    }

    .header p {
      margin-top: 8px;
      opacity: .75;
      font-size: 15px;
    }

    .naam-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
    }

    .naam-card {
      border: 0;
      min-height: 150px;
      border-radius: 24px;
      padding: 20px 12px;
      background: rgba(255,255,255,.55);
      backdrop-filter: blur(10px);
      box-shadow: 0 8px 25px rgba(80,50,20,.10);
      color: #4b3525;
      cursor: pointer;
      transition: transform .2s, box-shadow .2s;
      font-family: inherit;
    }

    .naam-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 30px rgba(80,50,20,.16);
    }

    .naam-card:active {
      transform: scale(.97);
    }

    .emoji {
      font-size: 30px;
      display: block;
      margin-bottom: 12px;
    }

    .naam {
      font-size: 19px;
      font-weight: bold;
      line-height: 1.35;
    }

    .mantra-card {
      margin-top: 15px;
      width: 100%;
      border: 0;
      border-radius: 24px;
      padding: 25px 18px;
      background: rgba(255,255,255,.65);
      box-shadow: 0 8px 25px rgba(80,50,20,.10);
      color: #4b3525;
      cursor: pointer;
      font-family: inherit;
      transition: transform .2s, box-shadow .2s;
    }

    .mantra-card:hover {
      transform: translateY(-3px);
    }

    .mantra-title {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 12px;
    }

    .mantra-text {
      font-size: 17px;
      line-height: 1.8;
    }

    .footer {
      text-align: center;
      padding: 35px 10px 15px;
      opacity: .65;
      font-size: 13px;
    }

    @media (max-width: 430px) {
      body {
        padding: 14px;
      }

      .naam-grid {
        gap: 10px;
      }

      .naam-card {
        min-height: 135px;
      }

      .naam {
        font-size: 16px;
      }

      .header h1 {
        font-size: 32px;
      }
    }
  </style>
</head>

<body>

  <main class="app">

    <header class="header">
      <div class="symbol">🪷📿</div>
      <h1>SoulBeads</h1>
      <p>A peaceful space for Naam Jap</p>
    </header>

    <section class="naam-grid">

      <button class="naam-card" onclick="openJap('Radhe Radhe','💐♥️')">
  <span class="emoji">💐♥️</span>
  <span class="naam">Radhe Radhe</span>
      </button>

      <button class="naam-card">
        <span class="emoji">🦚</span>
        <span class="naam">Radhe Krishna</span>
      </button>

      <button class="naam-card">
        <span class="emoji">🪷</span>
        <span class="naam">Hare Krishna<br>Hare Ram</span>
      </button>

      <button class="naam-card">
        <span class="emoji">🫀</span>
        <span class="naam">Jay Khodiyar Maa</span>
      </button>

      <button class="naam-card">
        <span class="emoji">🕉️</span>
        <span class="naam">साम्ब सदाशिव</span>
      </button>

    </section>

    <button class="mantra-card">
      <div class="mantra-title">🪷 Krishna Mantra</div>

      <div class="mantra-text">
        ॐ कृष्णाय वासुदेवाय हरये परमात्मने।<br>
        प्रणतः क्लेशनाशाय गोविंदाय नमो नमः॥
      </div>
    </button>

    <footer class="footer">
      Made with devotion • SoulBeads 🪷
    </footer>

  </main>
  <section id="japScreen" class="jap-screen">

  <button class="back-btn" onclick="goHome()">← Back</button>

  <div class="jap-content">

    <div id="japImage" class="jap-image">
      🪷
    </div>

    <h2 id="japNaam">Radhe Radhe</h2>

    <div class="counter-circle">
      <div id="count">0</div>
      <small>of 1008</small>
    </div>

    <div class="progress-area">
      <div class="progress-bar">
        <div id="progressBar"></div>
      </div>

      <p id="progressText">0% complete</p>
    </div>

    <button class="jap-button" onclick="doJap()">
      📿
    </button>

    <p class="tap-text">Tap to chant</p>

    <button class="reset-button" onclick="resetJap()">
      Reset Count
    </button>

  </div>

  </section>
  <script src="app.js"></script>

</body>
</html>
