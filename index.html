<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="SoulBeads — a peaceful digital space for Naam Jap and daily devotion."
  >

  <title>SoulBeads 📿</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- =========================
       HOME SCREEN
  ========================== -->

  <main class="app">

    <h1>SoulBeads 📿</h1>

    <p class="subtitle">
      Pause. Chant. Remember. 🪷
    </p>


    <!-- =========================
         NAAM SELECTION
    ========================== -->

    <section class="chant-grid">

      <!-- Radhe Radhe -->

      <button
        class="chant-card"
        onclick="openJap('Radhe Radhe', '💐♥️')"
      >

        <div class="chant-icon">
          💐
        </div>

        <h2>
          Radhe Radhe
        </h2>

      </button>


      <!-- Radhe Krishna -->

      <button
        class="chant-card"
        onclick="openJap('Radhe Krishna', '🦚')"
      >

        <div class="chant-icon">
          🦚
        </div>

        <h2>
          Radhe Krishna
        </h2>

      </button>


      <!-- Hare Krishna -->

      <button
        class="chant-card"
        onclick="openJap('Hare Krishna Maha-Mantra', '🪷')"
      >

        <div class="chant-icon">
          🪷
        </div>

        <h2>
          Hare Krishna Maha-Mantra
        </h2>

      </button>


      <!-- Khodiyar Maa -->

      <button
        class="chant-card"
        onclick="openJap('Jay Khodiyar Maa', '🫀')"
      >

        <div class="chant-icon">
          🫀
        </div>

        <h2>
          Jay Khodiyar Maa
        </h2>

      </button>


      <!-- Samb Sadashiv -->

      <button
        class="chant-card"
        onclick="openJap('साम्ब सदाशिव', '🔱')"
      >

        <div class="chant-icon">
          🔱
        </div>

        <h2>
          साम्ब सदाशिव
        </h2>

      </button>

    </section>


    <!-- =========================
         KRISHNA MANTRA
    ========================== -->

    <section class="mantra-card">

      <div class="chant-icon">
        🦚
      </div>

      <h2>
        Krishna Mantra
      </h2>

      <p>
        ॐ कृष्णाय वासुदेवाय हरये परमात्मने।<br>
        प्रणतः क्लेशनाशाय गोविंदाय नमो नमः॥
      </p>

      <button
        class="chant-card"
        onclick="openJap('Krishna Mantra', '🦚')"
        style="margin-top: 18px; min-height: auto; width: 100%;"
      >
        Begin Jap 📿
      </button>

    </section>

  </main>


  <!-- =========================
       JAP SCREEN
  ========================== -->

  <section
    id="japScreen"
    class="jap-screen"
  >

    <button
      class="back-btn"
      onclick="goHome()"
    >
      ← Back
    </button>


    <div class="jap-content">

      <!-- Devotional image / placeholder -->

      <div
        id="japImage"
        class="jap-image"
      >
        🪷
      </div>


      <!-- Selected Naam -->

      <h2 id="japNaam">
        Radhe Radhe
      </h2>


      <!-- Counter -->

      <div class="counter-circle">

        <div id="count">
          0
        </div>

        <small>
          of 1008
        </small>

      </div>


      <!-- Progress -->

      <div class="progress-area">

        <div class="progress-bar">

          <div id="progressBar"></div>

        </div>

        <p id="progressText">
          0% complete
        </p>

      </div>


      <!-- Main Jap Button -->

      <button
        class="jap-button"
        onclick="doJap()"
        aria-label="Count one Jap"
      >
        📿
      </button>

      <p class="tap-text">
        Tap to chant
      </p>


      <!-- Reset -->

      <button
        class="reset-button"
        onclick="resetJap()"
      >
        Reset Count
      </button>

    </div>

  </section>

<!-- Reset Confirmation Modal -->

<div id="resetModal" class="reset-modal">

  <div class="reset-box">

    <div class="reset-symbol">📿</div>

    <h3>Do you want to reset?</h3>

    <p>Your current Jap count will return to 0.</p>

    <div class="reset-actions">

      <button
        class="reset-cancel"
        onclick="closeResetModal()"
      >
        Cancel
      </button>

      <button
        class="reset-confirm"
        onclick="confirmReset()"
      >
        Yes, Reset
      </button>

    </div>

  </div>

</div>
  
  <!-- =========================
       JAVASCRIPT
  ========================== -->

  <script src="app.js"></script>

</body>
</html>
