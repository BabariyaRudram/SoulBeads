name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Check Flutter project
        run: |
          pwd
          ls -la
          test -f pubspec.yaml || {
            echo "ERROR: pubspec.yaml not found in repository root"
            exit 1
          }

      - name: Create Android project files
        run: |
          flutter create \
            --platforms=android \
            --org com.soulbeads \
            --project-name soulbeads \
            /tmp/gen

          rm -rf android
          cp -r /tmp/gen/android ./android

          sed -i 's/android:label="[^"]*"/android:label="SoulBeads"/' \
            android/app/src/main/AndroidManifest.xml

      - name: Install dependencies
        run: flutter pub get

      - name: Generate launcher icons
        run: dart run flutter_launcher_icons

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SoulBeads-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
